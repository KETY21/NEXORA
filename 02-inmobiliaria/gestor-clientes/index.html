<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA - Gestor Inmobiliario</title>
</head>

<body>

    <h1>NEXORA</h1>
    <h2>Gestor Inmobiliario</h2>

    <p>Panel de gestión de clientes y oportunidades inmobiliarias.</p>

    <hr>

    <h3>Nuevo cliente</h3>

    <form>
        <label>Nombre:</label><br>
        <input type="text" placeholder="Nombre del cliente"><br><br>

        <label>Teléfono:</label><br>
        <input type="tel" placeholder="Teléfono"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Correo electrónico"><br><br>

        <label>Tipo de cliente:</label><br>
        <select>
            <option>Comprador</option>
            <option>Vendedor</option>
            <option>Inversor</option>
            <option>Alquiler</option>
        </select><br><br>

        <label>Estado:</label><br>
        <select>
            <option>Nuevo</option>
            <option>Contactado</option>
            <option>En seguimiento</option>
            <option>Visita programada</option>
            <option>Negociación</option>
            <option>Cerrado</option>
        </select><br><br>

        <button type="button">Guardar cliente</button>
    </form>

    <hr>

    <h3>Clientes</h3>

    <p>Aquí aparecerán los clientes registrados.</p>

</body>
</html>
