<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA | Gestor de Inmuebles</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #172033;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.8;
        }

        .contenedor {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .tarjeta h2 {
            margin-top: 0;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .campo input,
        .campo select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }
.estado {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 13px;
}

.estado.disponible {
    color: green;
}

.estado.reservado {
    color: orange;
}

.estado.vendido {
    color: red;
}

.estado.alquilado {
    color: blue;
}
        .boton {
            grid-column: 1 / -1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #172033;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton:hover {
            opacity: 0.9;
        }

        @media (max-width: 700px) {
            .formulario {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🏠 NEXORA</h1>
        <p>Gestor de Inmuebles</p>
    </header>

    <div class="contenedor">

     </div>

<div class="tarjeta">   

            <h2>Nuevo inmueble</h2>

            <form class="formulario">

                <div class="campo">
                    <label>Referencia</label>
                    <input
                        type="text"
                        placeholder="Ej. NEX-001">
                </div>

                <div class="campo">
                    <label>Tipo de inmueble</label>
                    <select>
                        <option value="">Seleccionar tipo</option>
                        <option>Apartamento</option>
                        <option>Piso</option>
                        <option>Casa</option>
                        <option>Chalet</option>
                        <option>Local</option>
                        <option>Terreno</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Operación</label>
                    <select>
                        <option value="">Seleccionar operación</option>
                        <option>Venta</option>
                        <option>Alquiler</option>
                    </select>
                </div>
<div class="campo">
    <label>Estado</label>
    <select id="estado">
        <option value="Disponible">Disponible</option>
        <option value="Reservado">Reservado</option>
        <option value="Vendido">Vendido</option>
        <option value="Alquilado">Alquilado</option>
    </select>
</div>
                <div class="campo">
                    <label>Zona</label>
                    <input
                        type="text"
                        placeholder="Ej. San Pedro del Pinatar">
                </div>

                <div class="campo">
                    <label>Precio (€)</label>
                    <input
                        type="number"
                        placeholder="Ej. 185000">
                </div>

                <div class="campo">
                    <label>Superficie (m²)</label>
                    <input
                        type="number"
                        placeholder="Ej. 85">
                </div>

                <div class="campo">
                    <label>Habitaciones</label>
                    <input
                        type="number"
                        placeholder="Ej. 2">
                </div>

                <div class="campo">
                    <label>Baños</label>
                    <input
                        type="number"
                        placeholder="Ej. 2">
                </div>

                <button
                    class="boton"
                    type="button">
                    Guardar inmueble
                </button>

            </form>

        </div>

    </div class="tarjeta"><div class="tarjeta">
    <h2>📊 Estadísticas de inmuebles</h2>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px;">

        <div class="estadistica">
            <strong id="totalInmuebles">0</strong>
            <span>Total</span>
        </div>

        <div class="estadistica disponible">
            <strong id="totalDisponibles">0</strong>
            <span>Disponibles</span>
        </div>

        <div class="estadistica reservado">
            <strong id="totalReservados">0</strong>
            <span>Reservados</span>
        </div>

        <div class="estadistica vendido">
            <strong id="totalVendidos">0</strong>
            <span>Vendidos</span>
        </div>

        <div class="estadistica alquilado">
            <strong id="totalAlquilados">0</strong>
            <span>Alquilados</span>
        </div>

    </div>
</div>

    <h2>📋 Inmuebles recientes</h2>
<input
    type="text"
    id="buscadorInmuebles"
    placeholder="🔎 Buscar por referencia, tipo, operación o zona..."
    style="width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;"
>
  <div style="margin: 10px 0 15px 0;">
    <label for="filtroEstado"><strong>Estado:</strong></label>
    <select id="filtroEstado" style="padding: 10px; margin-left: 8px; border: 1px solid #ddd; border-radius: 8px;">
        <option value="Todos">Todos</option>
        <option value="Disponible">Disponible</option>
        <option value="Reservado">Reservado</option>
        <option value="Vendido">Vendido</option>
        <option value="Alquilado">Alquilado</option>
    </select>
</div>  
    <div id="listaInmuebles">
        <p>No hay inmuebles registrados todavía.</p>
    </div>
 </div>
</div>
<script src="script.js"></script>
</body>

</html>
